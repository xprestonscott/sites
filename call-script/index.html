<script type="text/plain" id=t0># Preston's Outreach Kit — Cold Calling Local OK Shops

**Channel:** phone. **Goal of call #1:** book a 15-min meeting OR get a *yes to text the demo link.* Never close price on the phone.
**Your edge:** ~400 of these leads already have a LIVE demo site at `xprestonscott.github.io/sites/<slug>/`. That changes the whole call — you're not pitching an idea, you're handing them something that already exists. Lead with that.

**Two call types — know which row you're on:**
- **DEMO-MATCHED** (~400 leads, site already built) → the "I already built you a live site" open. Strongest play. Use it every time you have a URL.
- **NO-DEMO** (no site built yet) → the standard no-website open; offer to build the free mockup.

**Voice check before you dial:** cold, laid-back, curious — never eager or slick. You're a neighbor with something useful, not a salesman. Slow down on the pain, speed up on the win, pause instead of "um."

---

## 1. COLD-CALL OPENERS (first 10-15 seconds)

### A. DEMO-MATCHED — you already built their site (your signature move)
Use this whenever you have a live URL for the row. It's your unfair advantage — nobody else calls with the thing already made.

> *"Hey, is this [Business]? — awesome. So this is gonna sound a little backwards, but I actually already built you a website. I do sites for shops around [town], I noticed y'all didn't have one, so I just went ahead and built a real live one for [Business]. It's online right now. Can I text you the link so you can see it?"*

Shorter, punchier version once you've said it 50 times:
> *"Hey — real quick, this is Preston, I build websites for shops here in [town]. I already built one for [Business] — it's live online right now. Want me to text you the link?"*

### B. DEMO-MATCHED + you have the owner's first name (~52 leads)
Your warmest cold call. Say the name like you already know him.

> *"Hey, is [Mike] around? ... Hey [Mike], it's Preston — I build websites for shops around [town]. This'll sound random, but I already went ahead and built one for [Business] — it's live online right now. Took me noticing you didn't have a site. Can I text you the link so you can see what I made?"*

### C. NO first name, NO demo yet — standard no-website open
Pattern-interrupt, de-pitch it, keep the focus on his shop.

> *"Hey — this is kind of random and I'm honestly not selling you anything right this second. I build websites for shops here in [town], and I was on [Business]'s Google listing and noticed there's no site yet. Do you have a sec, or did I catch you mid-something?"*

### D. Neutral / takeaway open (for skeptical or gruff answers)
When someone picks up cold and short, lower your energy, don't raise it.

> *"Yeah, no worries — I'm honestly not even sure it's a fit for your shop yet. I just build websites for local places and noticed a thing or two on [Business]'s listing I figured you'd want to know about. Mind if I ask you one quick thing?"*

---

## 2. GATEKEEPER LINES

**Ask for him by first name like a peer** (never "the owner" — that screams sales):
> *"Hey — is [Mike] around by any chance?"*

**If screened ("what's this about?") — be honest, low-key, specific:**
> *"Yeah, totally — I build websites for shops here in [town], and I actually already built one for [Business]. Just wanted to show [Mike] the link. Is he the right person for that?"*

**If he's out — recruit the gatekeeper, don't pitch them:**
> *"No worries — when's he usually easiest to catch? ... And is this the best number, or does he have a cell he actually answers?"*

**Takeaway if they push back:**
> *"Honestly I'm not even sure it's a fit yet — I just built a quick site for [Business] and figured he'd want to see it. Mind if I run it by him for 30 seconds?"*

**Leave-with-the-gatekeeper fallback (if you can't reach him):**
> *"Tell you what — could you tell [Mike] the website guy called and I already built [Business] a live site? If you've got his cell I'll just text him the link, saves everybody time."*

---

## 3. THE BOOKING ASK (books a meeting OR a yes-to-text — never price)

**Primary ask — the text (lowest friction, use this most):**
> *"Cool — what's the best cell to text it to? ... Perfect. Look for it in the next couple minutes, take a look between jobs and just shoot me a thumbs up or a 'nah.' That easy."*

**Upgrade to a 15-min meeting when he's engaged:**
> *"Here's what I'd do — the site's already built, so let's grab 15 minutes and I'll walk you through it and pull up your top competitor so we can look side by side. You easier to catch tomorrow afternoon, or Thursday morning?"*

**No-demo rows (offer to build the free mockup):**
> *"Would it be worth 15 minutes if I built you a quick free mockup of what [Business]'s site could look like, and walked you through it? Worst case you get a free design out of it."*

**Assume the next step once he says yes — go straight to logistics, don't re-sell:**
> *"Perfect — Thursday 10 it is. Site'll be pulled up ready to go, and I'll text you a reminder Wednesday night. Sound good?"*

---

## 4. VOICEMAIL (short, references the live demo, number twice)

**DEMO-MATCHED:**
> *"Hey [Mike], it's Preston — I build websites for shops here in [town]. Quick one: I actually already built [Business] a website and it's live online right now. Nothing urgent, I just want to text you the link so you can see it. Give me a shout — 918-XXX-XXXX, again that's 918-XXX-XXXX. Thanks [Mike]."*

**NO-DEMO:**
> *"Hey [Mike], it's Preston — I build websites for shops here in [town]. I was on [Business]'s Google listing and noticed there's no site yet, and I had a quick idea that'd help folks find you. Give me a shout — 918-XXX-XXXX, again 918-XXX-XXXX. Thanks."*

---

## 5. TEXT / DM TEMPLATES — "I built you a live site, here's the link"
Send right after they answer or reply. Keep it human, lowercase-casual, one link, one tiny ask.

### Auto / body shop (trades vibe — plain, no fluff)
> *"Hey [Mike], Preston here — the website guy. This is the one I built for [Business]: xprestonscott.github.io/sites/[slug]/ — it's live right now. Shows your hours, services, and lets folks tap to call you. Take a look when you're off a job and lmk what you think. If the info's wrong anywhere I'll fix it, no charge."*

### Salon / spa / café (warmer, look-and-feel matters)
> *"Hi [name]! This is Preston — I build websites for local spots and I made one for [Business]: xprestonscott.github.io/sites/[slug]/ 💇 It's live now — has your services, hours, and a spot for people to book or call. Have a peek when you get a sec and tell me if it feels like you. Easy to tweak the colors/photos to match your vibe."*

### Trades — plumber / HVAC / electrician / landscaping (results-first)
> *"Hey [Mike] — Preston, the website guy. Built [Business] a real site so people who Google you at 9pm actually find you instead of the next guy: xprestonscott.github.io/sites/[slug]/ — live right now, tap-to-call built in. Look it over between jobs and shoot me a thumbs up or 'nah.'"*

### Generic fallback (any category)
> *"Hey [name], it's Preston — I already built [Business] a website and it's live: xprestonscott.github.io/sites/[slug]/ — take a look and lmk what you think, easy to change anything on it."*

---

## 6. FOLLOW-UP SEQUENCE (Day 1 / 3 / 5 / 8)
Reference the SPECIFIC demo every touch. Never "just checking in."

**Day 1 — Call + voicemail. If you got a cell, text the link (Section 5).**
> Text: *"Here's the site I built for [Business]: xprestonscott.github.io/sites/[slug]/ — live right now. Lmk what you think."*

**Day 3 — Call again, different angle. If no answer, text:**
> *"Hey [Mike] — did that link come through? The [Business] site's still up: xprestonscott.github.io/sites/[slug]/ — takes 30 seconds to look. Even if it's a no I'd love to know."*

**Day 5 — Text a competitor comparison (concrete, not pushy):**
> *"[Mike] — pulled up [Competitor] earlier, they've had a site for a while and it's why they show up first on Google. Yours is already built and honestly cleaner: xprestonscott.github.io/sites/[slug]/ — want me to get it pointed at your own domain so it's officially yours?"*

**Day 8 — Final call + soft close-out text (leave the door open):**
> *"Last one from me, [Mike] — no worries if the timing's off. The [Business] site's sitting here live with your name on it whenever you want it: xprestonscott.github.io/sites/[slug]/ — I'm Preston, right here in [town]. Just holler."*

**Then:** park it, re-touch monthly with new work / a screenshot / a seasonal angle.

**Went-quiet recovery (any point) — light, ego-tap:**
> *"Ha — figured you got slammed at the shop, not a big deal. That [Business] site's still up with your name on it. When's good this week?"*

---

## 7. OBJECTION ONE-LINERS (phone versions)

**"Not interested."**
> *"Totally fair, figured you might say that — but the site's already built and live, costs you nothing to glance at. Want me to just text you the link, or you genuinely don't want the extra jobs?"*

**"Too busy / bad time."** (your easiest book — believe it, don't push)
> *"That's exactly why I won't keep you — I'll just text you the link, takes 30 seconds when it's calmer. Best cell?"*

**"How much?"** (do NOT quote — you don't know scope)
> *"Whoa, hang on — I don't even know what [Business] needs yet, a one-pager and a full booking site are totally different money. Look at the site first, it's free to see, and we'll talk real numbers once you know you like it. Deal?"*

**"I already have a site / a guy."** (never knock it — make him voice the gap)
> *"Nice, that's more than most shops have — what made you feel it's not quite doing everything you want? ... Let's put mine next to it: xprestonscott.github.io/sites/[slug]/ — if yours is already winning I'll tell you straight and buy you a coffee."*

**"Send me an email."** (convert to a text + real artifact)
> *"I can — but honestly a web guy's email gets buried. Let me text you the actual live site instead of a brochure. Best number? ... Cool, look for it and hit me a thumbs up or 'nah.'"*

**"Is this a scam / how'd you get my number?"**
> *"Fair question — no scam, I'm Preston, I build sites for local shops and your number's on your Google listing. I literally just built [Business] a site because y'all didn't have one. It's live, I'll text you the link, judge for yourself."*

**When to book vs let go:** any engagement (a question, an admitted gap, a real time) → drive to the text or the meeting. Two flat brush-offs, zero engagement → thank him, leave the door open, hang up. Small town, don't burn goodwill.

---

## 8. PER-LEAD FILL-IN TEMPLATE (work the sheet row by row)

```
BUSINESS:   ________________________________
OWNER:      ______________  (blank? use Opener A/C/D)
CATEGORY:   ______________  (auto / salon / trades / café)
DEMO URL:   xprestonscott.github.io/sites/____________/   ( [ ] built  [ ] none )
PHONE:      ______________

OPENER USED:   [ ] A demo   [ ] B demo+name   [ ] C no-demo   [ ] D takeaway
LAST TOUCH:    Day ___  |  ___/___  |  [ ] call [ ] vm [ ] text  |  outcome: __________
NEXT TOUCH:    Day ___  |  ___/___  |  action: __________________________________
STATUS:        [ ] no answer  [ ] texted link  [ ] meeting booked  [ ] dead  [ ] CLIENT
NOTES:         ___________________________________________________________________
```

**Row-by-row rhythm:** URL in hand → Opener A (or B if you have the name) → get the cell → text the link (Section 5) → log Day 1 → set Day 3 → next row. Batch ~20-30 dials in a focused block, same opener all block, fix one line, run the next block. Goal per block: one meeting or one yes-to-text.

<script type="text/plain" id=t1># Preston's Cold-Call Playbook
### Selling local websites by phone — Claremore / Owasso, OK

**The one reframe that changes everything:** a cold call is not a walk-in. There's a gatekeeper in the way, no demo you can point at, low attention, and a stranger who didn't ask to hear from you. So the goal of call #1 is **NOT to close.** It's to **book a meeting** (in person or video) where you show the site you'll build — or, at minimum, get his cell and a *yes* to text him a free mockup. Every play below serves that one goal. Anything that tries to close price on the phone gets you hung up on.

Built from 162 mined findings (heavy on Andres Contreras, plus Jeremy Miner/NEPQ cold calling, Grant Cardone, Andy Elliott, Belfort, Hormozi, Massarelli). Corroborated mechanics only — self-reported close rates, income claims, and funnel stats are cut and named in Section 10. And note your own record: **2 of your 3 clients came warm.** Cold calling is one channel, not the whole plan.

---

## 1. LEAD GENERATION — where the calls come from (ranked)

**Frame: Hormozi's Core Four** *(established framework, not from these transcripts)* — every lead is one of: (1) warm outreach, (2) cold outreach (this playbook), (3) content, (4) paid ads. Run cold + warm now; let content build in the background.

**RANK 1 — Paul's `maps_leads.py` = your ready-made cold-call list.** It scrapes Google Maps for local businesses **with phone numbers** and **flags which have NO website.** That's a pre-qualified call sheet: name, phone, category, and the exact reason to call, in one file (`memory/leads/maps-<city>.json`). No-website shops are the warmest cold calls you can make — the pain is a *stated fact,* not a guess.
> `maps_leads.py --city "Owasso OK" --preset trades --max 40` → call every row where website = none.

**RANK 2 — Referral loop from your 3 clients.** Warm is your proven channel. Ask each for ONE name, and keep the ask tiny so it's effortless.
> *"Hey [client], quick one — the site's been doing its job for you. Who's one other shop owner around here you'd trust me to help the same way? You don't have to intro us, just a name and I'll take it from there."*

**RANK 3 — New-business / LLC / DBA filings.** OK Secretary of State business filings, county assumed-name records, new-business notes in the *Claremore Progress* / *Owasso Reporter*. Brand-new shops rarely have a site and are actively spending to launch — they're **catalyst** leads (something just changed).
> *"Hey Mike — saw you just opened [Shop] over on [street]. Congrats. When folks Google you right now, though, there's nothing there yet — is getting found online something you're still setting up, or has it been on the back burner?"*

**RANK 4 — Chamber of Commerce directories** (Claremore Area Chamber, Owasso Chamber). Public member lists, phone numbers attached, and members already invest in visibility — a spend signal. Many list a chamber profile but no real site.
> *"Hi, I saw you're a member over at the Claremore Chamber — I build websites for local shops here and noticed yours points to Facebook rather than a real site. Mind if I ask you one quick thing?"*

**RANK 5 — Content / personal brand (warm inbound, long game).** Post real before/after builds and honest "this shop had no website" clips so owners DM you first — warm inbound closes far easier than cold. *(The specific "post 6-8 to 20-30x/day" claim is cut as hype; keep the principle: post local work consistently.)*
> Caption: *"This Claremore auto shop had zero website — customers couldn't even find their hours. Here's the 3-page site I built them in a week. Before / after 👇"*

**RANK 6 — Warm outreach FIRST, always.** Your first client came from messaging someone you knew. Before any cold block, exhaust your contacts, RSU classmates, and family's network. Cheapest, highest-close leads you have.
> *"Hey — I've been building websites for local businesses. Know anyone with a shop or side business whose online stuff looks rough? Happy to build them something."*

**RANK 7 — Drive-by list building.** Out in town, log shops with dated/hand-painted storefronts or no URL on the window → look them up → if no site, add the phone to the call list. Turns errands into lead gen, no walk-in required.

---

## 2. BEFORE YOU DIAL

- **Pre-qualify the list.** Prioritize: *no site at all* > *broken DIY site* > *dated site + already runs ads* (they spend). Tag each row `NO-SITE / BAD-SITE / HAS-SITE-SPENDING` so your opener fits.
- **Know the ANSWER call #1 must reach, not a rigid script.** A script is the *answers* you want, not the words. For call #1 the answer is: *"yes, show me"* or *"yes, text me the demo."* Keep several ways to get there.
- **Drill ONE script daily** until it's instinct — hand-write the opener + booking ask, say each line aloud with real tone. Goal: never think about your next line so you can *hear* the owner. Keep a mirror on the desk.
- **Mindset: sell FOR him, not TO him.** You get these shops customers they're losing right now. Rejection = redirection to the next number. Early no's are reps.
- **Call in BLOCKS, one variable at a time.** Batch ~20-30 dials in a focused hour, *same opener all block* so improvement compounds. Change ONE line next block, not the whole pitch.
- **Timing:** mid-morning (9:30-11) or early afternoon (1:30-3) for trades/auto — skip the 8am open and the lunch slam. If you miss him, ask the front desk when he's calm.

---

## 3. THE GATEKEEPER — getting to the owner

**Sound like a peer who knows him.** Use his first name as if you should know each other. Asking for "the owner" flags you as a sales call instantly.
> *"Hey — is Mike around by any chance?"* (relaxed, mid-pace)

**If screened ("what's this about?"), be honest and low-key** — cagey = obvious salesperson. Name something real and specific.
> *"Yeah, no worries — I build websites for shops here in [town] and I was looking at Mike's Google listing, noticed a couple things I figured he'd want to know about. Is he the right person for that?"*

**If he's out, recruit the gatekeeper, don't pitch them.**
> *"Totally fine — when's he usually easiest to catch? ... And is this the best number, or does he have a cell he actually answers?"*

**Neutral/takeaway works here too** — pushy triggers the brush-off.
> *"I'm honestly not even sure it's a fit for him yet — I just noticed a thing or two on his listing. Mind if I run it by him for 30 seconds?"*

---

## 4. THE OPEN — first 10-15 seconds with the owner

**Pattern-interrupt.** Don't sound like every other salesperson or he flips to "not interested." Lead with a curious, slightly *lowered* tone, a real specific detail, and explicitly de-pitch it.
> *"Hey Mike — this is kind of random, and I'm honestly not selling you anything right this second. I was on your Google listing looking at shops in Claremore and noticed something — do you have a sec, or did I catch you mid-something?"*

**Permission + neutral "not sure it's even a fit."** Neutral makes him pull you in; eager-positive puts his guard up.
> *"I'm not even sure it makes sense for your shop yet, so mind if I ask you one quick thing to find out?"*

**15-second agenda** — controls the frame, signals you're a pro.
> *"Here's all I'm doing — one or two questions about how customers find you, and if there's something worth fixing I'll show you exactly what I'd build. If it's not a fit I'll tell you straight and let you go. Cool?"*

**Keep the focus OFF you.** No credentials, no portfolio yet — that raises his guard. All about his shop.
> *"Walk me through how folks find you right now — mostly word of mouth, or...?"*

---

## 5. DISCOVERY BY PHONE — build urgency with no demo in hand

**Bucket first** (you can't see his setup):
> *"Real quick so I'm not talking past you — do you have a website at all right now, or is it mostly the Facebook page?"*

**Diagnose like a doctor before you prescribe** — and *pull the string he gives you* (echo his words, go deeper) instead of jumping ahead.
> *"How do most new customers find you today? ... Got it — and roughly how many new ones a month? ... What's a typical job worth to you?"*

**Quantify the leak — but make HIM say it.** Then the consequence/future-pain question. Pain + fear of future pain is what creates urgency.
> *"So if someone Googles you after hours and there's no site — where do you figure that customer ends up? ... And if that keeps going another year, what's that costing you in jobs you never even hear about?"*

**Surface the PAST objection early** (whatever stopped him before is what he'll stall on later):
> *"Have you ever thought about getting a real site before? ... What stopped you? ... And what's got you even open to talking about it now?"*

**Make him argue against his own "I already have X"** (never argue with him — let him list the gaps):
> *"The Facebook page — what's made you feel like that's not quite pulling its weight on its own?"*

**Flip qualification so HE qualifies the value** before you present anything:
> *"If I could get you showing up on Google and give folks a way to book you right from their phone — honestly, would that even help your shop, or are you already covered there?"*

---

## 6. THE ASK = BOOK THE MEETING (not close)

**Say it to yourself: call #1 closes nothing.** No live demo, low attention. The win is a booked meeting where he sees the site — or a *yes* to text him a demo.

**Ask permission to present, then book:**
> *"Would it make sense for me to actually build a quick mockup of what your shop's site could look like, and walk you through it — would that be worth 15 minutes?"*

**Tee up the free demo as the hook** (warm, "I can see it" leads close far easier):
> *"Here's what I'll do — before we talk I'll build you a real one-page mockup of your shop's site, on the house, so you're looking at the actual thing, not me describing it. Worst case you get a free design out of it."*

**Assistant frame + a choice of times** (never "do you want to meet?"), booked close (~1-3 days out):
> *"I'll have the mockup and pull up your top competitor's site so we can look side by side. You easier to catch tomorrow afternoon, or Thursday morning?"*

**If a meeting's too much, downgrade to a text** — tiny asks get acted on:
> *"No pressure on a meeting — easiest thing is I just text you the mockup when it's done, takes you two minutes to look. What's the best cell for that?"*

**Assume the next step once he says yes** — go straight to logistics, don't re-sell:
> *"Perfect — Thursday 10am then. I'll have your mockup ready, and I'll text you a reminder Wednesday night. Sound good?"*

---

## 7. OBJECTIONS ON THE PHONE

**Rule:** on the phone you only handle objections to the **meeting**, never to price. Almost every stall = "is this worth my time/money." Don't argue — loop back to *his problem,* not more features. Funnel any pushback into certainty: *"you just want to be sure it'd actually bring you customers, right?"*

**"Not interested."** — Reflexive. Agree, hit one curious specific line, then let go if still flat.
> *"Totally fair, I figured you might say that — real quick though, when I looked you up there was no site at all, so folks who Google you at 9pm just find your competitor. That's the only reason I called. Worth me sending you a free mockup, or you genuinely don't want the extra jobs?"*

**"Too busy / bad time."** — Your *easiest* book. Believe it, don't push through.
> *"That's exactly why I won't keep you — sounds like you're slammed, good problem. Let me just text you the free mockup and we grab 15 minutes when it's calmer. Mornings or afternoons better?"*

**"Send me an email."** — The polite black hole. Convert to a text + a real artifact.
> *"I can — but honestly emails from a web guy get buried. Tell you what: I'll text you a link to an actual mockup of YOUR site, not a brochure. What's the best number? ... Cool, look for it tomorrow and shoot me a thumbs up or 'nah.'"*

**"How much?"** — **Do NOT quote.** You don't know scope; a blind number is a price war you lose. Deflect playfully, hold frame, route to the meeting.
> *"Whoa, hang on cowboy — I don't even know what your shop needs yet, and I'd be guessing. A one-pager and a full booking site are totally different money. Let me build the mockup and I'll show you real options Thursday — deal?"*

**"Already have a guy / a site."** — Never knock it. Make him voice the gap, book the comparison.
> *"Nice, that's more than most shops have — what made you feel it might not be doing everything you want? ... Yeah. Let me build a quick mockup and we'll put it next to what you've got and your competitor's — if yours is already winning, I'll tell you and buy you a coffee. Fair enough?"*

**When to BOOK vs LET GO:** any engagement (a question, an admitted gap, a real time) → drive to book. Two flat brush-offs, zero engagement → thank him, leave the door open, hang up. Small town — don't burn goodwill.
> *"No worries at all Mike, appreciate you taking the call — if you ever want that free mockup, I'm [name], right here in [town]. Take care."*

---

## 8. VOICEMAIL + FOLLOW-UP CADENCE

**Voicemail** — short, specific, curious, NOT a pitch. Under ~20 sec, number twice.
> *"Hey Mike, it's Preston — I build websites for shops here in [town]. I was on your Google listing and noticed there's no site yet. Nothing urgent, I just had a quick idea that'd help folks find you. Give me a shout — 918-XXX-XXXX, again 918-XXX-XXXX. Thanks Mike."*

**Cadence (value-first, persistent):** *(Hormozi's "respond in 60 sec / 50% buy from the first responder" stats are cut as unverified — but fast + persistent + value-first is the right direction.)*
- **Day 1:** call + voicemail. If you got a cell, text the free mockup.
- **Day 3:** call again, different angle.
- **Day 5:** text a competitor comparison.
- **Day 8:** final call.
- Then park + re-touch monthly with new content.

Reference the **specific artifact** every time — never "just checking in":
> *"Hey Mike — that mockup of your shop's site is done, sending it now. Take a look between jobs and tell me if it's close."*

**No-show / went-quiet recovery** — light, ego-tap, get them back live:
> *"Ha — didn't peg you as a no-show type, figured you got slammed at the shop. No sweat. That mockup's still sitting here with your name on it — when's good this week?"*

---

## 9. TONALITY FOR THE PHONE (voice-only — your #1 lever)

On the phone you have **only your voice** — no handshake, no demo, no face. Same script blows the call if the tone's wrong.

- **Cold, laid-back, curious** — never strong/aggressive. Direct words + casual tone lands; direct words + hard tone triggers resistance.
- **Neutral/takeaway default:** *"I honestly don't know yet if this makes sense for your shop — mind if I ask one thing?"* Unsure pulls him in; eager pushes him away.
- **Pace = persuasion:** slow WAY down on the cost of having no site (sounds important); speed up, brighter, on the results a new site brings; slow again for the ask.
- **Smile + stand up + mirror** while dialing — your face controls your voice even unseen; posture controls energy.
- **Pause, don't stutter.** A calm 2-3 sec silence reads confident; "um/uh" reads nervous vendor. Silence after you name the time is fine — let him answer.
- **Sound like HIM, not a slick closer.** Use his exact words back ("get you found," not "your SEO"). Keep your natural Oklahoma phrasing — canned closer cadence = "talking to a salesman."

**Drills:** record the same line "salesy" vs "curious neighbor," keep the second. Read the consequence line at half speed, the results line quick. Replace every "um" with a closed-mouth pause.

## 10. IGNORE THIS (the hype to skip)

- **Self-reported close rates** — "90% close week," Belfort's "1-in-5, divide commission by 5" math, any "this script closes X%." No verification.
- **Income claims as proof** — "$100k/mo at 18," "$20K at 17," "$15k/mo on 587 followers." Motivation, not mechanics.
- **Funnel/stat numbers stated as fact** — Hormozi's "respond in 60 sec / 50% buy from first responder / 5-min delay drops close 80%," the exact "book 1 day out = highest, 2 days = 20% lower…" table, "post 6-8 to 20-30×/day," the "UCLA 80% of charisma is non-verbal" stat, the "$3k-$15k price sweet spot." Directions may be right; the numbers are uncorroborated — don't repeat them as fact.
- **The "scale to $20-40k = calls × close × cash × commission" formula** — irrelevant to a solo web guy booking meetings.
- **Andrew Tate bravado** — "70% of people are arrogant/poor," nod-don't-smile status games, "demand your raise or quit." Ego theater that backfires on a low-key Oklahoma owner. The one usable kernel ("you fix cars, I do websites all day") is already folded in.
- **Hard high-pressure CLOSES on the phone** — Andy Elliott's "if you feel pressured it's because I am," pay-in-full discount reveals, 3-tier price anchoring, deposits, "go silent after the price." Those are for the **sit-down meeting,** not call #1 — using them cold gets you hung up on.
- **Deep reframes/analogies on the first call** — McDonald's-worker-vs-entrepreneur, lion-behind-you, spouse-responsibility island reframe. The transcripts themselves warn these trigger massive resistance before rapport/pain exist. Meeting only.
- **Manipulation/trap language** — "sound fair?", fake-personal automated reminders, insincere identity-labeling. Corroborated as things that *backfire.*
