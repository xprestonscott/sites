<!-- NAME: Duotone Grade | WHY: The photo is flattened into a single-color duotone so any busy image becomes calm brand-toned texture that text reads cleanly over. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Pest Pros — Sand Springs Pest Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f3a;
    --navy-deep:#071429;
    --accent:#ff8a3d;
    --white:#ffffff;
    --muted:rgba(255,255,255,.75);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--navy-deep);color:var(--white)}

  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;
    background:linear-gradient(180deg,rgba(7,20,41,.75),rgba(7,20,41,0));
  }
  .nav.solid{background:rgba(7,20,41,.9);backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:#fff;text-decoration:none}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--navy-deep);display:grid;place-items:center;font-size:17px;font-weight:800}
  .nav-call{
    background:var(--accent);color:var(--navy-deep);text-decoration:none;
    font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;
    transition:transform .15s ease;
  }
  .nav-call:hover{transform:translateY(-1px)}

  .hero{
    position:relative;min-height:100vh;
    display:flex;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;padding:120px 24px 80px;
  }
  /* Duotone stack: grayscale image -> multiply navy -> screen navy highlight */
  .duotone{position:absolute;inset:0;background:var(--navy)}
  .duotone img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) contrast(1.05) brightness(.9);
    mix-blend-mode:multiply;opacity:.9;
  }
  .duotone::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(7,20,41,.55) 0%,rgba(7,20,41,.25) 45%,rgba(7,20,41,.8) 100%);
  }

  .hero-inner{position:relative;z-index:2;max-width:820px;display:flex;flex-direction:column;align-items:center}
  .badge{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px);
    padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:30px;
  }
  .stars{color:var(--accent);letter-spacing:2px;font-size:12px}
  h1{
    font-family:'Sora',sans-serif;font-weight:800;
    font-size:clamp(46px,7.5vw,92px);line-height:1.02;letter-spacing:-.03em;
    margin-bottom:22px;
    text-shadow:0 2px 30px rgba(7,20,41,.5);
  }
  h1 span{color:var(--accent)}
  .sub{font-size:clamp(16px,1.5vw,20px);line-height:1.6;color:var(--muted);max-width:52ch;margin:0 auto 38px}
  .ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
  .btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:16px;padding:17px 32px;border-radius:14px;transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--accent);color:var(--navy-deep);box-shadow:0 12px 34px rgba(255,138,61,.32)}
  .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
  .btn-ghost:hover{border-color:rgba(255,255,255,.6)}
  .phone{font-size:14px;color:var(--muted);margin-bottom:34px}
  .phone a{color:#fff;font-weight:700;text-decoration:none}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{
    font-size:13px;font-weight:500;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(6px);
    padding:9px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;
  }
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

  @media (max-width:520px){
    .hero{padding:110px 20px 64px}
    .btn{width:100%;justify-content:center}
    .ctas{width:100%;flex-direction:column}
  }
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a class="brand" href="#"><span class="brand-mark">P</span>Premier Pest Pros</a>
  <a class="nav-call" href="tel:9189730344">(918) 973-0344</a>
</nav>

<section class="hero">
  <div class="duotone"><img src="pest.jpg" alt=""></div>
  <div class="hero-inner">
    <div class="badge"><span class="stars">★★★★★</span> Loved by locals</div>
    <h1>Bugs out.<br><span>Peace back.</span></h1>
    <p class="sub">Family-run pest control keeping Sand Springs and greater Tulsa critter-free.</p>
    <div class="ctas">
      <a class="btn btn-primary" href="tel:9189730344">Call now</a>
      <a class="btn btn-ghost" href="#work">See our work</a>
    </div>
    <p class="phone">Or dial <a href="tel:9189730344">(918) 973-0344</a></p>
    <div class="chips">
      <span class="chip">Locally owned</span>
      <span class="chip">Free estimates</span>
      <span class="chip">Serving Sand Springs</span>
    </div>
  </div>
</section>
<script>
  const nav=document.getElementById('nav');
  addEventListener('scroll',()=>nav.classList.toggle('solid',scrollY>40),{passive:true});
</script>
</body>
</html>
